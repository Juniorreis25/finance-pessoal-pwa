<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1117" />
    <title>Finance Pessoal — sem conexão</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { width: min(100%, 420px); }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 3px solid #00f0ff;
        border-radius: 24px;
        color: #fff;
        font-size: 24px;
        font-weight: 800;
        transform: rotate(45deg);
      }
      .mark span { transform: rotate(-45deg); }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0; color: #8e8e93; line-height: 1.6; }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: #00f0ff;
        color: #0a0a0a;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span>FP</span></div>
      <h1>Você está sem conexão</h1>
      <p>Por segurança, nenhum dado financeiro é exibido offline. Reconecte-se à internet e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
